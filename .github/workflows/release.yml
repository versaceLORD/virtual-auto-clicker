name: Release

# Runs when a PR is merged (i.e. on every push to main).
# A release is only created when <Version> in Directory.Build.props has no
# matching tag yet. To ship a release, bump the version in your PR.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    # Manual runs from other branches never release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version and check for an existing tag
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $version = "$version".Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Version '$version' in Directory.Build.props is not a valid SemVer version."
          }

          $tags = git ls-remote --tags origin "refs/tags/$version" "refs/tags/v$version"
          if ($tags) {
            "::notice::Version $version is already released. Bump <Version> in Directory.Build.props to create a new release."
            "release=false" >> $env:GITHUB_OUTPUT
          } else {
            "::notice::Releasing version $version."
            "release=true" >> $env:GITHUB_OUTPUT
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  test:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test -c Release

  publish:
    needs: [version, test]
    strategy:
      matrix:
        rid: [win-x86, win-x64]
        flavor: [standalone, framework-dependent]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish (standalone, Native AOT)
        if: matrix.flavor == 'standalone'
        run: >
          dotnet publish src/VirtualAutoClicker -c Release -r ${{ matrix.rid }} -warnaserror
          -p:Version=${{ needs.version.outputs.version }}
          -o artifacts/out

      - name: Publish (framework-dependent, needs .NET 10 runtime)
        if: matrix.flavor == 'framework-dependent'
        run: >
          dotnet publish src/VirtualAutoClicker -c Release -r ${{ matrix.rid }} -warnaserror
          --self-contained false -p:PublishAot=false -p:PublishSingleFile=true
          -p:Version=${{ needs.version.outputs.version }}
          -o artifacts/out

      - name: Package
        shell: pwsh
        run: |
          $name = "VirtualAutoClicker-${{ needs.version.outputs.version }}-${{ matrix.rid }}-${{ matrix.flavor }}"
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Compress-Archive -Path artifacts/out/VirtualAutoClicker.exe, README.md, LICENSE -DestinationPath "artifacts/release/$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}-${{ matrix.flavor }}
          path: artifacts/release/

  release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Checksums
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*.zip

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: release/*
          body: |
            ## Downloads

            | File | Runs on | Needs .NET installed? |
            |---|---|---|
            | `*-win-x64-standalone.zip` | 64-bit Windows | No |
            | `*-win-x86-standalone.zip` | 32-bit Windows | No |
            | `*-win-x64-framework-dependent.zip` | 64-bit Windows | Yes, the [.NET 10 Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) (x64) |
            | `*-win-x86-framework-dependent.zip` | 32-bit Windows | Yes, the [.NET 10 Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) (x86) |

            If you're unsure, pick **win-x64-standalone**. Verify downloads with `SHA256SUMS.txt`.

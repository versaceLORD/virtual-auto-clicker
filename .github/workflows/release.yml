name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        if: matrix.rid == 'win-x64'
        run: dotnet test -c Release

      - name: Publish (Native AOT)
        run: dotnet publish src/VirtualAutoClicker -c Release -r ${{ matrix.rid }} -warnaserror -p:Version=${{ steps.version.outputs.value }}

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "VirtualAutoClicker-${{ steps.version.outputs.value }}-${{ matrix.rid }}"
          $dir = "artifacts/release"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Compress-Archive -Path "artifacts/publish/VirtualAutoClicker/release_${{ matrix.rid }}/VirtualAutoClicker.exe", "README.md", "LICENSE" -DestinationPath "$dir/$name.zip"
          $hash = (Get-FileHash "$dir/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Out-File -Encoding ascii "$dir/$name.zip.sha256"
          "zip=$dir/$name.zip" >> $env:GITHUB_OUTPUT

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.package.outputs.zip }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true

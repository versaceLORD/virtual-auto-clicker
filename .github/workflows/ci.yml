name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --coverage --coverage-output-format cobertura --report-trx --results-directory artifacts/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/TestResults/
          if-no-files-found: ignore

  publish:
    # Verifies every release variant publishes (no trim/AOT warnings) on every change.
    needs: build
    strategy:
      matrix:
        rid: [win-x86, win-x64]
        flavor: [standalone, framework-dependent]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish (standalone, Native AOT)
        if: matrix.flavor == 'standalone'
        run: dotnet publish src/VirtualAutoClicker -c Release -r ${{ matrix.rid }} -warnaserror -o artifacts/out

      - name: Publish (framework-dependent)
        if: matrix.flavor == 'framework-dependent'
        run: >
          dotnet publish src/VirtualAutoClicker -c Release -r ${{ matrix.rid }} -warnaserror
          --self-contained false -p:PublishAot=false -p:PublishSingleFile=true
          -o artifacts/out

      - uses: actions/upload-artifact@v7
        with:
          name: VirtualAutoClicker-${{ matrix.rid }}-${{ matrix.flavor }}
          path: artifacts/out/VirtualAutoClicker.exe
